schema: spec-driven
locale: tw
claude_slash_commands: false

context: |
  Project: ClaudeCab - Lightweight multi-agent Telegram Bot framework
  Tech stack: TypeScript 5.x (strict), Node.js >= 20, grammy, better-sqlite3, Express + EJS, Vitest
  AI SDK: @anthropic-ai/claude-agent-sdk (NOT @anthropic-ai/sdk)
  Architecture: "Directory-as-Agent" - each agents/{id}/ is an isolated Claude Code workspace
  Key principles:
    - SDK-first: leverage Claude Agent SDK built-in features
    - Agent self-management: memory/persona managed by agent via CLAUDE.md, zero engine awareness
    - SDKQueryManager is extractable: zero business logic in SDK integration layer
    - Configuration-driven: JSON/YAML configs for agents
  Language: 繁體中文 for documentation, English for specs (normative language)

rules:
  proposal:
    - Keep proposals concise (1-2 pages)
    - Reference existing ADRs when relevant
    - Always include affected code paths
  tasks:
    - Break tasks into chunks completable in one session
    - Mark parallel-safe tasks with [P]

parallel_tasks: true