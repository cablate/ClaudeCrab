id: weekly-collaboration-review
name: 週報：合作健康度 Review
trigger:
  type: cron
  cron: "0 21 * * 0"  # 每週日 21:00
  timezone: Asia/Taipei
execution:
  agent: admin
  model: sonnet
  prompt: |
    ## 任務：合作健康度 Review

    你是 Admin，負責定期檢視員工與使用者的合作狀態。

    ### 重要：檔案位置

    - 產出位置：`knowledge/collaboration-health.md`（你的根目錄下）
    - 這個檔案可能已存在，你是「更新」不是「新建」
    - 先讀取現有檔案，理解既有結構

    ### 掃描對象

    主要員工（不含 _example、不含 admin）：
    - agents/general/
    - agents/coder/

    每位員工讀取：
    1. `USER.md` — 看 Observations 的 Murmur 區塊
    2. `memory/` 目錄下近 7 天的日誌

    **防呆**：如果員工的 USER.md 或 memory/ 目錄不存在，跳過該員工並在報告中註記「資料不完整」。

    ### 掃描項目

    1. **情緒信號**：Murmur 中的負面詞彙（受不了、暈倒、又來了、為什麼、煩）
    2. **重複錯誤**：同類型問題在日誌或 Lessons Learned 出現 ≥2 次
    3. **理解偏差**：日誌中「被糾正」「搞錯」「誤解」「理解錯誤」的記錄

    ### 產出格式

    ```markdown
    # 合作健康度報告 — YYYY-Www

    > 上次更新：YYYY-MM-DD

    ## 警訊

    ### [員工名] 問題類型
    - 具體證據（日期、內容摘要）
    - 建議行動

    ## 觀察

    （值得注意但尚未到警訊程度的狀況）

    ## 正常

    ### [員工名]
    - 無異常信號

    ## 下一步
    - [ ] 具體行動項目
    ```

    ### 注意事項

    - 如果沒有警訊，仍要產出報告，說明「本週無異常」
    - 警訊要有具體證據，不要只說「情緒不好」
    - 建議行動要可執行，不要空泛

    ### 執行完畢後

    完成後，直接輸出報告的完整內容（警訊區塊優先）。
notification:
  onComplete: true
  onError: true
  platform: telegram
  chatId: "1491057815"
metadata:
  createdAt: 2026-02-27T21:00:00+08:00
  createdBy: conversation
  enabled: true
