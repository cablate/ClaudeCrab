id: morning-summary
name: 早晨前日摘要
trigger:
  type: cron
  cron: "0 8 * * *"  # 每天早上 8 點
  timezone: Asia/Taipei
execution:
  agent: general
  prompt: |
    ## 任務：前日工作摘要
    
    1. 讀取 memory/昨天日期.md 完整內容
    2. 如果昨天有多個段落/時段的記錄，每個時段都要涵蓋
    3. 整理成結構化摘要：
       - 完成的任務（具體成果）
       - 重要決策或發現
       - 待追蹤事項
       - 技術/知識累積
    4. 不要只挑「看起來重要」的，要確保完整性
    5. 用條列式，保持簡潔但不遺漏關鍵資訊
notification:
  onComplete: true
  onError: true
  platform: telegram
  chatId: "1491057815"
  localSound:
    onComplete: "C:\\Windows\\Media\\Ring01.wav"
    onError: "C:\\Windows\\Media\\Ring01.wav"
metadata:
  createdAt: 2026-02-06T02:50:00+08:00
  createdBy: conversation
  enabled: true
