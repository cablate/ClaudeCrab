id: example/example-daily-check
name: Example Daily Check
description: Minimal recurring schedule example.
trigger:
  type: cron
  cron: "0 9 * * *"
  timezone: Asia/Taipei
execution:
  agent: example
  prompt: |
    Produce a short daily decision check for Discord thread delivery.

    Before writing:
    - Compare with yesterday's output if it exists in the working directory.
    - Compare against previous or recent history when it is available.
    - If there is no change, low signal, or insufficient signal, say so directly and give only one maintenance action.
    - Validate inputs before using them. If an input is missing, an API has an error, or verification fails, use the fallback "unknown" instead of inventing facts.
    - The final response must contain the complete user-facing result. Do not only write a file path or internal execution note.

    Output in Markdown with exactly this output format:
    ## Decision Signal
    - One sentence on whether anything deserves attention today.

    ## What Changed
    - 1-3 concrete bullets. If nothing changed, write "No meaningful change detected."

    ## Recommended Action
    - One concrete next action.

    ## Follow-up Question
    - One question that would help clarify the next decision.
  maxTurns: 3
output:
  mode: thread
  channelId: "000000000000000000"
  threadTitle: "{{name}} - {{date}}"
  autoArchive: 24h
  persistSession: true
  delivery: last-only
metadata:
  createdAt: "2026-06-20"
  createdBy: example
  enabled: false
  tags:
    - example
